services:
  - type: web
    name: ai-brain
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /
    disk:
      name: ai-brain-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROK_API_KEY_1
        sync: false
      - key: GROK_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
