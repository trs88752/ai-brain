<!DOCTYPE html>
<html lang="en">
<head>
    {% include "_pwa_head.html" %}
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Second Brain | {{ note.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/module_ui.css', v='20261010-pwa-1') }}">
  <style>.note-view{white-space:pre-wrap;font-size:16px;line-height:1.85;color:#e5eefc}.note-meta{color:#aebed5;margin:8px 0 22px}.note-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}</style>
</head>
<body class="module-page module-notes"><main class="container">
  <header class="header"><h1><i class="fa-solid fa-note-sticky"></i> {{ note.title }}</h1><a class="back" href="{{ url_for('notes') }}"><i class="fa-solid fa-arrow-left"></i> My Notes</a></header>
  <article class="card"><p class="note-meta">Saved note</p><div class="note-view">{{ note.content }}</div><div class="note-actions"><a class="btn" href="{{ url_for('edit_note', id=note.id) }}"><i class="fa-solid fa-pen"></i> Edit Note</a><form action="{{ url_for('delete_note', id=note.id) }}" method="POST" onsubmit="return confirm('Delete this note?');"><button class="delete" type="submit"><i class="fa-solid fa-trash"></i> Delete</button></form></div></article>
</main><script src="{{ url_for('static', filename='js/app_shell.js', v='20261010-pwa-1') }}"></script></body></html>
